services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
      # ホストの設定ファイルをマウント
      - ~/.zshrc:/home/developer/.zshrc_host:ro
      - ~/.zsh_history:/home/developer/.zsh_history
      - ~/.gitconfig:/home/developer/.gitconfig:ro
      - ~/.ssh:/home/developer/.ssh:ro
      # Claude Code設定のマウント（プロジェクト横断で共有・書き込みあり）
      - ~/.claude:/home/developer/.claude
      - ~/.claude.json:/home/developer/.claude.json
      # GitHub CLI認証情報のマウント（プロジェクト横断で共有・書き込みあり）
      - ~/.config/gh:/home/developer/.config/gh
      # ホスト共有ディレクトリ（全コンテナ共通・書き込みあり）
      - ${SHARED_DIR:-${HOME}/Documents/shared}:/home/developer/shared:cached
    command: sleep infinity
    environment:
      # 拡張機能開発用の環境変数
      - NODE_ENV=development
